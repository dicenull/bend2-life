<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ライフゲーム | Bend 2</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#111a1a;color:#eef5e5;font:16px/1.5 system-ui,sans-serif}
main{max-width:1520px;margin:auto;padding:22px 16px 32px} header{display:flex;align-items:end;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(26px,7vw,40px);letter-spacing:.025em} .tag{font:600 12px monospace;background:#263d35;color:#a9f4bb;border-radius:99px;padding:5px 10px;margin-bottom:6px;white-space:nowrap}
p{margin:7px 0 15px;color:#bdcfbd;font-size:14px}
.stage{--stage-height:72dvh;overflow:auto;max-height:var(--stage-height);background:#162421;border:1px solid #5b766b;border-radius:8px}
canvas{display:block;width:min(100%,calc(var(--stage-height) * var(--ratio) - 4px));height:auto;margin-inline:auto;cursor:crosshair;touch-action:none}
.stage.is-zoomed canvas{width:max(100%,var(--zoom-width));margin-inline:0}
.stage.is-zoomed canvas:active{cursor:grabbing}
.bar [aria-pressed="true"]{outline:2px solid #9ef0b8;outline-offset:-2px}
@media(max-width:550px){main{padding:15px 10px 24px}.stage{--stage-height:65dvh}output{margin-left:0;width:100%}}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:12px 0} button,select{font:inherit;padding:8px 11px;min-height:42px;border-radius:8px;border:1px solid #5b766b;color:#eef5e5;background:#20332d}
button{cursor:pointer} #run{color:#0c2015;background:#9ef0b8;border-color:#9ef0b8;font-weight:700} button:focus-visible,select:focus-visible{outline:2px solid #e9e87d;outline-offset:2px}
output{margin-left:auto;font:13px monospace;color:#c1d9bc} small{color:#bdcfbd}
</style>
<main>
<header><h1>ライフゲーム</h1><span class="tag">BEND 2 · B3/S23</span></header>
<p>マスをタップ・ドラッグして配置。細かいところは拡大し、移動モードで盤面をずらせます。</p>
<div class="bar" aria-label="操作">
<select id="board-size" aria-label="盤面サイズ">
<option value="64x40">64 × 40</option><option value="96x56" selected>96 × 56</option><option value="128x72">128 × 72</option>
</select>
<button id="zoom" type="button" aria-pressed="false">拡大</button>
<button id="pan" type="button" aria-pressed="false" disabled>移動</button>
<button id="run" type="button">再生</button><button id="step" type="button">1世代進める</button><button id="clear" type="button">消去</button>
<select id="pattern" aria-label="初期パターン">
<option value="glider">グライダー</option><option value="blinker">ブリンカー</option><option value="block">ブロック</option><option value="random">ランダム</option>
</select><button id="preset" type="button">配置</button><output id="status"></output>
</div>
<div id="stage" class="stage"><canvas id="board" aria-label="ライフゲームの盤面"></canvas></div>
<small>誕生：近くに3つ。生存：2つか3つ。盤面の端はつながらない。</small>
</main>
<script type="module">
const Life = (() => {
function word_to_u32(w) {
  let x = 0;

    x |= Number(w.head) << i;

  let w = {$: "WNil"};

function cmp_new(a, b) {
  return {$: a < b ? "LT" : a === b ? "EQ" : "GT"};

function nat_divmod(a, b) {
  return tup_new(b && Math.trunc(a / b), b ? a % b : a);

function nat_chk(n) {

    throw "bend: a Nat past the largest immediate 2^48-1";

  if (!Number.isInteger(n) || n < 0 || n > 2 ** 53) {
    throw "bend: expected a Nat host number: an integer from 0 to 2^53";

function f32_show(x) {
  let s = "nan";
  for (let p = 1; x === x && p <= 9 && f32_round(s) !== x; p += 1) {
    s = String(Number(x.toExponential(p - 1)));
  }
  return (Object.is(x, -0) ? "-0" : s).replace("Infinity", "inf");
}

function f32_bits(x) {
  return new Uint32Array(new Float32Array([x]).buffer)[0];
}

function f32_from_bits(u) {
  return new Float32Array(new Uint32Array([u]).buffer)[0];
}

function f32_read(s) {
  const re = /^[\t\n\v\f\r ]*[+-]?((\d+(?:\.\d*)?|\.\d+)(e[+-]?\d+)?|inf(inity)?|nan)$/i;
  return re.test(s) ? {$: "Some", value: f32_round(
    s.replace(/inf\w*/i, "Infinity"))} : {$: "None"};

const f32_round = function f32_round(s) {
  const d = Number(s), a = Math.abs(d), f = Math.fround(a), g = 2 * a - Math.min(f, 340282366920938500000000000000000000000);
  if (g === f || Math.fround(g) !== g || g === 1 / 0)
    return Math.sign(d) * f;

  while (a * 2 ** k % 1 !== 0)
    k += 1;
  const [, i, r, e] = /(\d*)\.?(\d*)(?:e([+-]?\d+))?$/i.exec(s), n = Number(e ?? 0) - r.length, x = BigInt(i + r) * 2n ** BigInt(k) * 10n ** BigInt(Math.max(n, 0)), y = BigInt(a * 2 ** k) * 10n ** BigInt(Math.max(-n, 0));

const char_new = function char_new(c) {
  return c < 55296 ? String.fromCharCode(c) : c >= 57344 && c <= 1114111 ? String.fromCodePoint(c) : String.fromCharCode(56320, c >>> 22, c >>> 11 & 2047, c & 2047);

function char_len(s, at = 0) {
  const c = s.codePointAt(at);
  return c === 0xDC00 ? 4 : c > 0xFFFF ? 2 : 1;
}

function char_code(s) {
  return s.length < 4 ? s.codePointAt(0)
    : (s.charCodeAt(1) << 22 | s.charCodeAt(2) << 11 | s.charCodeAt(3)) >>> 0;
}

function string_contains(s, p) {
  // A match starts at a Char, not inside a packed U32 code.
  for (let at = 0; at <= s.length; at += char_len(s, at)) {
    if (s.startsWith(p, at)) {
      return true;
    }
  }
  return false;
}

function str_out(s) {
  return s.replace(/\uDC00[^]{3}/gu, "\uFFFD");
}

function str_in(s) {
  return s.replace(/\p{Cs}/gu, "\uFFFD");
}

// Array
// =====

function array_new(d, v, lgs) {
  if (d > 31 - lgs) {
    throw "bend: an array past the deepest block class 31 (depth + log2 words per cell)";
  }
  return Array(2 ** d).fill(v);
}

function array_node(a, b) {
  if (a.length !== b.length) {
    throw "bend: runtime fail-stop";
  }
  return a.concat(b);
}

function array_swap(a, i, v) {
  const old = a[i &= a.length - 1];
  a[i] = v;
  return tup_new(a, old);
}

// Run
// ===

function run_tail(f, x) {
  return {$: "$JMP", f: f.j?.f === f ? f.j : f, x};
}

function run_clo(j) {
  const f = (x) => run_loop(j(x));
  f.j = j;
  j.f = f;
  return f;
}

function run_loop(r) {
  while (r !== null && typeof r === "object" && r.$ === "$JMP") {
    r = r.f(r.x);
  }
  return r;
}

function run_lib(f, n) {
  return (...a) => a.length < n ? run_lib((...b) => f(...a, ...b), n - a.length)
    : run_loop(f(...a));
}

// Effect
// ======

const $0eff = Object.create(null);
const io_file_append = new Set();

function io_eff(k, run) {
  if (arguments.length > 2) {
    throw new Error("bend: " + k + " takes no need: an effect that waits parks itself");
  }
  if (k in $0eff) {
    throw new Error("bend: two effects register " + k);
  }
  $0eff[k] = run;
}
// Program
// =======

function $next_cell(_alive_0, _neighbors_0) {
  if (_neighbors_0 == 0) {
    return false;
  } else if (_neighbors_0 == 1) {
    return false;
  } else if (_neighbors_0 == 2) {
    return _alive_0;
  } else if (_neighbors_0 == 3) {
    return true;
  } else {
    return false;
  }
}

function $bit(_row_0, _mask_0) {
  const _x_0 = ((_row_0 & _mask_0) >>> 0);
  return $Bool_to_u32((_x_0 !== 0));
}

function $lanes_for(_word_0, _edge_0) {
  const _x_0 = ((_word_0 << 1) >>> 0);
  const _x_1 = ((_edge_0 & 1) >>> 0);
  const _west_0 = ((_x_0 | _x_1) >>> 0);
  const _x_2 = ((_edge_0 >>> 1) >>> 0);
  const _x_3 = ((_x_2 & 1) >>> 0);
  const _x_4 = ((_word_0 >>> 1) >>> 0);
  const _x_5 = (31 >= 32 ? 0 : (_x_3 << 31) >>> 0);
  const _east_0 = ((_x_4 | _x_5) >>> 0);
  return {$: "lanes", "west": _west_0, "center": _word_0, "east": _east_0};
}

function $full_count(_row_0, _mask_0) {
  const _w_0 = _row_0["west"];
  const _c_0 = _row_0["center"];
  const _e_0 = _row_0["east"];
  const _x_0 = $$bit(_w_0, _mask_0);
  const _x_1 = $$bit(_c_0, _mask_0);
  const _x_2 = ((_x_0 + _x_1) >>> 0);
  const _x_3 = $$bit(_e_0, _mask_0);
  return ((_x_2 + _x_3) >>> 0);
}

function $scan_word($0, $1, $2, $3, $4, $5) {
  for (;;) {
    {
      const _fuel_0 = $0;
      const _top_0 = $1;
      const _mid_0 = $2;
      const _bottom_0 = $3;
      const _mask_0 = $4;
      const _acc_0 = $5;
      if (_fuel_0 == 0) {
        return _acc_0;
      } else {
        const _rest_0 = (_fuel_0 - 1);
        const _w_0 = _mid_0["west"];
        const _c_0 = _mid_0["center"];
        const _e_0 = _mid_0["east"];
        const _x_0 = $$bit(_w_0, _mask_0);
        const _x_1 = $$bit(_e_0, _mask_0);
        const _x_2 = $$full_count(_top_0, _mask_0);
        const _x_3 = ((_x_0 + _x_1) >>> 0);
        const _x_4 = ((_x_2 + _x_3) >>> 0);
        const _x_5 = $$full_count(_bottom_0, _mask_0);
        const _n_0 = ((_x_4 + _x_5) >>> 0);
        const _x_6 = $$bit(_c_0, _mask_0);
        const _old_0 = (_x_6 !== 0);
        const _x_7 = $$Bool_to_u32($$next_cell(_old_0, (_n_0 )));
        const _born_0 = (Math.imul(_x_7, _mask_0) >>> 0);
        $0 = _rest_0;
        $1 = _top_0;
        $2 = {$: "lanes", "west": _w_0, "center": _c_0, "east": _e_0};
        $3 = _bottom_0;
        $4 = ((_mask_0 << 1) >>> 0);
        $5 = ((_acc_0 | _born_0) >>> 0);
        continue;
      }
    }
  }
}

function $next_word(_top_0, _mid_0, _bottom_0, _top_edge_0, _mid_edge_0, _bottom_edge_0) {
  return $scan_word(32, $$lanes_for(_top_0, _top_edge_0), $$lanes_for(_mid_0, _mid_edge_0), $$lanes_for(_bottom_0, _bottom_edge_0), 1, 0);
}

function $next_row(_top_0, _mid_0, _bottom_0) {
  return $next_word(_top_0, _mid_0, _bottom_0, 0, 0, 0);
}

function $Bool_to_u32(_b_0) {
  if (!_b_0) {
    return 0;
  } else {
    return 1;
  }
}

const $$bit = $bit;
const $$full_count = $full_count;
const $$next_cell = $next_cell;
const $$Bool_to_u32 = $Bool_to_u32;
const $$lanes_for = $lanes_for;return {
  "next_cell": run_lib((a0,a1) => run_loop($next_cell(a0,nat_in(a1))), 2),
  "bit": run_lib((a0,a1) => run_loop($bit(a0,a1)), 2),
  "lanes_for": run_lib((a0,a1) => run_loop($lanes_for(a0,a1)), 2),
  "full_count": run_lib((a0,a1) => run_loop($full_count(a0,a1)), 2),
  "scan_word": run_lib((a0,a1,a2,a3,a4,a5) => run_loop($scan_word(nat_in(a0),a1,a2,a3,a4,a5)), 6),
  "next_word": run_lib((a0,a1,a2,a3,a4,a5) => run_loop($next_word(a0,a1,a2,a3,a4,a5)), 6),
  "next_row": run_lib((a0,a1,a2) => run_loop($next_row(a0,a1,a2)), 3),

})();
// Flat row-major bitboard. Widths are multiples of 32; one U32 per word.
function makeBoard(width,height){
  if(!Number.isSafeInteger(width)||width<32||width%32!==0||!Number.isSafeInteger(height)||height<1)throw RangeError('Invalid board dimensions');
  return {width,height,stride:width/32,words:new Uint32Array(width/32*height)};
}
function getCell(b,x,y){
  if(x<0||x>=b.width||y<0||y>=b.height)return 0;
  return (b.words[y*b.stride+(x>>>5)]>>>(x&31))&1;
}
function putCell(b,x,y,on){
  if(x<0||x>=b.width||y<0||y>=b.height)return;
  const i=y*b.stride+(x>>>5), mask=1<<(x&31);
  b.words[i]=on?b.words[i]|mask:b.words[i]&~mask;
}
function resizeBoard(b,width,height){
  const out=makeBoard(width,height), stride=Math.min(b.stride,out.stride);
  for(let y=0;y<Math.min(height,b.height);y++){
    const start=y*b.stride;
    out.words.set(b.words.subarray(start,start+stride),y*out.stride);
  }
  return out;
}
function advance(Life,b){
  const out=makeBoard(b.width,b.height), a=b.words, s=b.stride;
  const edge=(i,left,right)=>((left?a[i-1]>>>31:0)|((right?a[i+1]&1:0)<<1));
  for(let y=0;y<b.height;y++)for(let w=0;w<s;w++){
    const i=y*s+w, above=i-s, below=i+s, left=w>0,right=w+1<s;
    out.words[i]=Life.next_word(
      y>0?a[above]:0,a[i],y+1<b.height?a[below]:0,
      y>0?edge(above,left,right):0,edge(i,left,right),y+1<b.height?edge(below,left,right):0
    );
  }
  return out;
}

const el=(id)=>document.getElementById(id);
const cv=el('board'), ctx=cv.getContext('2d'), stage=el('stage'), run=el('run'), px=12;
let board=makeBoard(96,56), generation=0, timer=null, paint=null, drag=null;
let zoomed=false, panning=false;
const patterns={glider:[[1,0],[2,1],[0,2],[1,2],[2,2]],blinker:[[0,1],[1,1],[2,1]],block:[[0,0],[1,0],[0,1],[1,1]]};
function setGeometry(){
  cv.width=board.width*px;cv.height=board.height*px;
  stage.style.setProperty('--zoom-width',board.width*18+'px');
  stage.style.setProperty('--ratio',String(board.width/board.height));
  cv.setAttribute('aria-label',`${board.width} × ${board.height} の盤面`);
}
function render(){
  ctx.fillStyle='#172521';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#273d36';
  for(let x=1;x<board.width;x++)ctx.fillRect(x*px,0,1,cv.height);
  for(let y=1;y<board.height;y++)ctx.fillRect(0,y*px,cv.width,1);
  let alive=0;
  ctx.fillStyle='#a3f3ba';
  for(let y=0;y<board.height;y++)for(let w=0;w<board.stride;w++){
    let v=board.words[y*board.stride+w];
    while(v){
      const x=w*32+31-Math.clz32(v&-v);
      ctx.fillRect(x*px+1,y*px+1,px-1,px-1);alive++;
      v&=v-1;
    }
  }
  el('status').value=`${board.width} × ${board.height} ｜ 世代 ${generation} / 生存 ${alive}`;
}
function next(){board=advance(Life,board);generation++;render();}
function stop(){if(timer!==null){clearInterval(timer);timer=null;}run.textContent='再生';run.setAttribute('aria-pressed','false');}
function reset(){stop();board=makeBoard(board.width,board.height);generation=0;}
function place(name){
  reset();
  if(name==='random'){
    for(let y=0;y<board.height;y++)for(let x=0;x<board.width;x++)if(Math.random()<.24)putCell(board,x,y,1);
  }else{
    const ax=(board.width>>>1)-1,ay=(board.height>>>1)-1;
    for(const [x,y] of patterns[name])putCell(board,ax+x,ay+y,1);
  }
  render();
}
function setMode(on){
  panning=on;
  el('pan').textContent=on?'配置に戻る':'移動';
  el('pan').setAttribute('aria-pressed',String(on));
  cv.style.cursor=on?'grab':'crosshair';
}
el('zoom').addEventListener('click',()=>{
  zoomed=!zoomed;
  stage.classList.toggle('is-zoomed',zoomed);
  el('zoom').textContent=zoomed?'全体表示':'拡大';
  el('zoom').setAttribute('aria-pressed',String(zoomed));
  el('pan').disabled=!zoomed;
  setMode(false);
  stage.scrollLeft=zoomed?(stage.scrollWidth-stage.clientWidth)/2:0;
  stage.scrollTop=zoomed?(stage.scrollHeight-stage.clientHeight)/2:0;
});
el('pan').addEventListener('click',()=>setMode(!panning));
el('board-size').addEventListener('change',()=>{
  stop();const [w,h]=el('board-size').value.split('x').map(Number);
  board=resizeBoard(board,w,h);setGeometry();render();
});
function locate(e){
  const rect=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)*board.width/rect.width),y=Math.floor((e.clientY-rect.top)*board.height/rect.height);
  return x>=0&&x<board.width&&y>=0&&y<board.height?[x,y]:null;
}
function applyStroke(p){
  if(!p||!paint||p[0]===paint.x&&p[1]===paint.y)return;
  const [tx,ty]=p;let {x,y}=paint;
  const dx=Math.abs(tx-x),sx=x<tx?1:-1,dy=-Math.abs(ty-y),sy=y<ty?1:-1;let error=dx+dy;
  for(;;){
    putCell(board,x,y,paint.on);
    if(x===tx&&y===ty)break;
    const e2=2*error;if(e2>=dy){error+=dy;x+=sx;}if(e2<=dx){error+=dx;y+=sy;}
  }
  paint.x=tx;paint.y=ty;render();
}
cv.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0)return;
  if(panning){
    drag={x:e.clientX,y:e.clientY,left:stage.scrollLeft,top:stage.scrollTop};
    cv.setPointerCapture(e.pointerId);return;
  }
  const p=locate(e);if(!p)return;stop();const [x,y]=p;
  paint={x,y,on:!getCell(board,x,y)};putCell(board,x,y,paint.on);cv.setPointerCapture(e.pointerId);render();
});
cv.addEventListener('pointermove',e=>{
  if(!e.isPrimary)return;
  if(drag){stage.scrollLeft=drag.left+drag.x-e.clientX;stage.scrollTop=drag.top+drag.y-e.clientY;}
  else applyStroke(locate(e));
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(event,e=>{if(e.isPrimary){paint=null;drag=null;}});
run.addEventListener('click',()=>{
  if(timer!==null){stop();return;}
  timer=setInterval(next,135);run.textContent='停止';run.setAttribute('aria-pressed','true');
});
el('step').addEventListener('click',()=>{stop();next();});
el('clear').addEventListener('click',()=>{reset();render();});
el('preset').addEventListener('click',()=>place(el('pattern').value));
setGeometry();place('glider');
</script>
</html>
