<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ライフゲーム | Bend 2</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#111a1a;color:#eef5e5;font:16px/1.5 system-ui,sans-serif}
main{max-width:630px;margin:auto;padding:22px 16px 32px} header{display:flex;align-items:end;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(26px,7vw,40px);letter-spacing:.025em} .tag{font:600 12px monospace;background:#263d35;color:#a9f4bb;border-radius:99px;padding:5px 10px;margin-bottom:6px;white-space:nowrap}
p{margin:7px 0 15px;color:#bdcfbd;font-size:14px} canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#162421;border:1px solid #5b766b;cursor:crosshair;touch-action:none}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:12px 0} button,select{font:inherit;padding:8px 11px;min-height:42px;border-radius:8px;border:1px solid #5b766b;color:#eef5e5;background:#20332d}
button{cursor:pointer} #run{color:#0c2015;background:#9ef0b8;border-color:#9ef0b8;font-weight:700} button:focus-visible,select:focus-visible{outline:2px solid #e9e87d;outline-offset:2px}
output{margin-left:auto;font:13px monospace;color:#c1d9bc} small{color:#bdcfbd}
</style>
<main>
<header><h1>ライフゲーム</h1><span class="tag">BEND 2 · B3/S23</span></header>
<p>マスをタップ・ドラッグして生き物を配置。次の世代でどう変わるか試してみよう。</p>
<canvas id="board" width="640" height="640" aria-label="32マス四方の盤面"></canvas>
<div class="bar">
<button id="run" type="button">再生</button><button id="step" type="button">1世代進める</button><button id="clear" type="button">消去</button>
<select id="pattern" aria-label="初期パターン">
<option value="glider">グライダー</option><option value="blinker">ブリンカー</option><option value="block">ブロック</option><option value="random">ランダム</option>
</select><button id="preset" type="button">配置</button><output id="status"></output>
</div>
<small>誕生：近くに3つ。生存：2つか3つ。盤面の端はつながらない。</small>
</main>
<script type="module">
const Life = (() => {
function word_to_u32(w) {
  let x = 0;
  for (let i = 0; w.$ === "WCon"; i++) {
    x |= Number(w.head) << i;
    w = w.tail;
  }
  return x >>> 0;
}

function u32_to_word(x) {
  let w = {$: "WNil"};
  for (let i = 31; i >= 0; i--) {
    w = {$: "WCon", head: ((x >>> i) & 1) === 1, tail: w};
  }
  return w;
}

function cmp_new(a, b) {
  return {$: a < b ? "LT" : a === b ? "EQ" : "GT"};
}

function tup_new(a, b) {
  return {$: "Tuple", fst: a, snd: b};
}

function nat_divmod(a, b) {
  return tup_new(b && Math.trunc(a / b), b ? a % b : a);
}

function nat_chk(n) {
  if (n > 281474976710655) {
    throw "bend: a Nat past the largest immediate 2^48-1";
  }
  return n;
}

function nat_in(n) {
  if (!Number.isInteger(n) || n < 0 || n > 2 ** 53) {
    throw "bend: expected a Nat host number: an integer from 0 to 2^53";
  }
  return n;
}

function f32_show(x) {
  let s = "nan";
  for (let p = 1; x === x && p <= 9 && f32_round(s) !== x; p += 1) {
    s = String(Number(x.toExponential(p - 1)));
  }
  return (Object.is(x, -0) ? "-0" : s).replace("Infinity", "inf");
}

function f32_bits(x) {
  return new Uint32Array(new Float32Array([x]).buffer)[0];
}

function f32_from_bits(u) {
  return new Float32Array(new Uint32Array([u]).buffer)[0];
}

function f32_read(s) {
  const re = /^[\t\n\v\f\r ]*[+-]?((\d+(?:\.\d*)?|\.\d+)(e[+-]?\d+)?|inf(inity)?|nan)$/i;
  return re.test(s) ? {$: "Some", value: f32_round(
    s.replace(/inf\w*/i, "Infinity"))} : {$: "None"};
}

const f32_round = function f32_round(s) {
  const d = Number(s), a = Math.abs(d), f = Math.fround(a), g = 2 * a - Math.min(f, 340282366920938500000000000000000000000);
  if (g === f || Math.fround(g) !== g || g === 1 / 0)
    return Math.sign(d) * f;

  while (a * 2 ** k % 1 !== 0)
    k += 1;
  const [, i, r, e] = /(\d*)\.?(\d*)(?:e([+-]?\d+))?$/i.exec(s), n = Number(e ?? 0) - r.length, x = BigInt(i + r) * 2n ** BigInt(k) * 10n ** BigInt(Math.max(n, 0)), y = BigInt(a * 2 ** k) * 10n ** BigInt(Math.max(-n, 0));
  return Math.sign(d) * (x === y || x > y !== g > f ? f : g);
};

const char_new = function char_new(c) {
  return c < 55296 ? String.fromCharCode(c) : c >= 57344 && c <= 1114111 ? String.fromCodePoint(c) : String.fromCharCode(56320, c >>> 22, c >>> 11 & 2047, c & 2047);
};

function char_len(s, at = 0) {
  const c = s.codePointAt(at);
  return c === 0xDC00 ? 4 : c > 0xFFFF ? 2 : 1;
}

function char_code(s) {
  return s.length < 4 ? s.codePointAt(0)
    : (s.charCodeAt(1) << 22 | s.charCodeAt(2) << 11 | s.charCodeAt(3)) >>> 0;
}

function string_contains(s, p) {
  // A match starts at a Char, not inside a packed U32 code.
  for (let at = 0; at <= s.length; at += char_len(s, at)) {
    if (s.startsWith(p, at)) {
      return true;
    }
  }
  return false;
}

function str_out(s) {
  return s.replace(/\uDC00[^]{3}/gu, "\uFFFD");
}

function str_in(s) {
  return s.replace(/\p{Cs}/gu, "\uFFFD");
}

// Array
// =====

function array_new(d, v, lgs) {
  if (d > 31 - lgs) {
    throw "bend: an array past the deepest block class 31 (depth + log2 words per cell)";
  }
  return Array(2 ** d).fill(v);
}

function array_node(a, b) {
  if (a.length !== b.length) {
    throw "bend: runtime fail-stop";
  }
  return a.concat(b);
}

function array_swap(a, i, v) {
  const old = a[i &= a.length - 1];
  a[i] = v;
  return tup_new(a, old);
}

// Run
// ===

function run_tail(f, x) {
  return {$: "$JMP", f: f.j?.f === f ? f.j : f, x};
}

function run_clo(j) {
  const f = (x) => run_loop(j(x));
  f.j = j;
  j.f = f;
  return f;
}

function run_loop(r) {
  while (r !== null && typeof r === "object" && r.$ === "$JMP") {
    r = r.f(r.x);
  }
  return r;
}

function run_lib(f, n) {
  return (...a) => a.length < n ? run_lib((...b) => f(...a, ...b), n - a.length)
    : run_loop(f(...a));
}

// Effect
// ======

const $0eff = Object.create(null);
const io_file_append = new Set();

function io_eff(k, run) {
  if (arguments.length > 2) {
    throw new Error("bend: " + k + " takes no need: an effect that waits parks itself");
  }
  if (k in $0eff) {
    throw new Error("bend: two effects register " + k);
  }
  $0eff[k] = run;
}
// Program
// =======

function $next_cell(_alive_0, _neighbors_0) {
  if (_neighbors_0 == 0) {
    return false;
  } else if (_neighbors_0 == 1) {
    return false;
  } else if (_neighbors_0 == 2) {
    return _alive_0;
  } else if (_neighbors_0 == 3) {
    return true;
  } else {
    return false;
  }
}

function $bit(_row_0, _mask_0) {
  const _x_0 = ((_row_0 & _mask_0) >>> 0);
  return $Bool_to_u32((_x_0 !== 0));
}

function $side_count(_row_0, _left_0, _right_0) {
  const _x_0 = $$bit(_row_0, _left_0);
  const _x_1 = $$bit(_row_0, _right_0);
  return ((_x_0 + _x_1) >>> 0);
}

function $full_count(_row_0, _left_0, _center_0, _right_0) {
  const _x_0 = $$side_count(_row_0, _left_0, _right_0);
  const _x_1 = $$bit(_row_0, _center_0);
  return ((_x_0 + _x_1) >>> 0);
}

function $scan_row($0, $1, $2, $3, $4, $5) {
  for (;;) {
    {
      const _fuel_0 = $0;
      const _top_0 = $1;
      const _mid_0 = $2;
      const _bottom_0 = $3;
      const _mask_0 = $4;
      const _acc_0 = $5;
      if (_fuel_0 == 0) {
        return _acc_0;
      } else {
        const _rest_0 = (_fuel_0 - 1);
        const _left_0 = ((_mask_0 >>> 1) >>> 0);
        const _right_0 = ((_mask_0 << 1) >>> 0);
        const _x_0 = $$full_count(_top_0, _left_0, _mask_0, _right_0);
        const _x_1 = $$side_count(_mid_0, _left_0, _right_0);
        const _x_2 = ((_x_0 + _x_1) >>> 0);
        const _x_3 = $$full_count(_bottom_0, _left_0, _mask_0, _right_0);
        const _n_0 = ((_x_2 + _x_3) >>> 0);
        const _x_4 = $$bit(_mid_0, _mask_0);
        const _old_0 = (_x_4 !== 0);
        const _x_5 = $$Bool_to_u32($$next_cell(_old_0, (_n_0 )));
        const _born_0 = (Math.imul(_x_5, _mask_0) >>> 0);
        $0 = _rest_0;
        $1 = _top_0;
        $2 = _mid_0;
        $3 = _bottom_0;
        $4 = _right_0;
        $5 = ((_acc_0 | _born_0) >>> 0);
        continue;
      }
    }
  }
}

function $next_row(_top_0, _mid_0, _bottom_0) {
  return $scan_row(32, _top_0, _mid_0, _bottom_0, 1, 0);
}

function $Bool_to_u32(_b_0) {
  if (!_b_0) {
    return 0;
  } else {
    return 1;
  }
}

const $$bit = $bit;
const $$side_count = $side_count;
const $$full_count = $full_count;
const $$next_cell = $next_cell;
const $$Bool_to_u32 = $Bool_to_u32;return {
  "next_cell": run_lib((a0,a1) => run_loop($next_cell(a0,nat_in(a1))), 2),
  "bit": run_lib((a0,a1) => run_loop($bit(a0,a1)), 2),
  "side_count": run_lib((a0,a1,a2) => run_loop($side_count(a0,a1,a2)), 3),
  "full_count": run_lib((a0,a1,a2,a3) => run_loop($full_count(a0,a1,a2,a3)), 4),
  "scan_row": run_lib((a0,a1,a2,a3,a4,a5) => run_loop($scan_row(nat_in(a0),a1,a2,a3,a4,a5)), 6),
  "next_row": run_lib((a0,a1,a2) => run_loop($next_row(a0,a1,a2)), 3),
};

})();
const N=32, cv=document.querySelector('#board'), ctx=cv.getContext('2d');
const el=(id)=>document.getElementById(id);
const run=el('run'), size=cv.width/N;
let rows=new Uint32Array(N), generation=0, timer=null, paint=null;
const patterns={glider:[[1,0],[2,1],[0,2],[1,2],[2,2]],blinker:[[0,1],[1,1],[2,1]],block:[[0,0],[1,0],[0,1],[1,1]]};
function render(){
  ctx.fillStyle='#172521';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#273d36';
  for(let i=1;i<N;i++){ctx.fillRect(i*size,0,1,cv.height);ctx.fillRect(0,i*size,cv.width,1);}
  let alive=0;
  ctx.fillStyle='#a3f3ba';
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if((rows[y]>>>x)&1){
    ctx.fillRect(x*size+2,y*size+2,size-3,size-3);alive++;
  }
  el('status').value=`世代 ${generation} / 生存 ${alive}`;
}
function next(){
  const old=rows;
  rows=Uint32Array.from(old,(m,y)=>Life.next_row(old[y-1]??0,m,old[y+1]??0));
  generation++;render();
}
function stop(){if(timer!==null){clearInterval(timer);timer=null;}run.textContent='再生';run.setAttribute('aria-pressed','false');}
function reset(){stop(); rows=new Uint32Array(N);generation=0;}
function place(name){
  reset();
  if(name==='random'){
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(Math.random()<.24) rows[y]|=1<<x;
  }else{
    const at=name==='glider'?8:14;
    for(const [x,y] of patterns[name]) rows[at+y]|=1<<(at+x);
  }
  render();
}
function locate(e){
  const rect=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)*N/rect.width),y=Math.floor((e.clientY-rect.top)*N/rect.height);
  return x>=0&&x<N&&y>=0&&y<N?[x,y]:null;
}
function applyStroke(p){
  if(!p||!paint||p[0]===paint.x&&p[1]===paint.y)return;
  const [tx,ty]=p;let {x,y}=paint;
  const dx=Math.abs(tx-x),sx=x<tx?1:-1,dy=-Math.abs(ty-y),sy=y<ty?1:-1;let error=dx+dy;
  for(;;){
    const bit=1<<x;rows[y]=paint.on?rows[y]|bit:rows[y]&~bit;
    if(x===tx&&y===ty)break;
    const e2=2*error;if(e2>=dy){error+=dy;x+=sx;}if(e2<=dx){error+=dx;y+=sy;}
  }
  paint.x=tx;paint.y=ty;render();
}
cv.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0)return;
  const p=locate(e);if(!p)return;stop();const [x,y]=p;
  paint={x,y,on:!((rows[y]>>>x)&1)};rows[y]^=1<<x;cv.setPointerCapture(e.pointerId);render();
});
cv.addEventListener('pointermove',e=>{if(e.isPrimary)applyStroke(locate(e));});
for(const event of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(event,()=>{paint=null;});
run.addEventListener('click',()=>{
  if(timer!==null){stop();return;}
  timer=setInterval(next,135);run.textContent='停止';run.setAttribute('aria-pressed','true');
});
el('step').addEventListener('click',()=>{stop();next();});
el('clear').addEventListener('click',()=>{reset();render();});
el('preset').addEventListener('click',()=>place(el('pattern').value));
place('glider');
</script>
</html>
