<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ライフゲーム | Bend 2</title>
<style>
:root{color-scheme:light;--paper:#e9edf8;--ink:#202743;--action:#343b82;--accent:#ffba70;--scope:#171d38;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
main{max-width:1540px;margin:auto;padding:clamp(8px,1.6vw,22px)}
.board-frame{overflow:hidden;border-radius:10px;background:var(--scope);border:1px solid #252e52;box-shadow:0 10px 22px #20274924}
.toolbar,.tool-group{display:flex;align-items:center;gap:6px}
.toolbar{flex-wrap:wrap;gap:7px 12px;padding:8px;background:#232b4a;border-bottom:1px solid #394469}
button,select{font:inherit;font-size:.84rem;font-weight:600;min-height:40px;padding:4px 9px;color:#f2f5ff;background:#303b5e;border:1px solid #637095;border-radius:6px}
button{cursor:pointer}
button svg{display:block;width:18px;height:18px}
button.icon{display:grid;place-items:center;min-width:40px;padding:4px}
button:enabled:hover,select:hover{background:#425179}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,select:focus-visible{outline:2px solid #ffcc99;outline-offset:2px}
button[aria-pressed="true"],#run{background:var(--accent);color:#352139;border-color:transparent}
#run:hover,button[aria-pressed="true"]:hover{background:#ffd19d}
#run[aria-pressed="false"] .pause-icon,#run[aria-pressed="true"] .play-icon{display:none}
output{margin-left:auto;color:#d9e2ff;font:.75rem/1.4 ui-monospace,"SF Mono","Hiragino Sans",monospace;font-variant-numeric:tabular-nums}
.stage{--stage-height:83dvh;overflow:auto;max-height:var(--stage-height);background:var(--scope)}
canvas{display:block;width:min(100%,calc(var(--stage-height) * var(--ratio) - 4px));height:auto;margin-inline:auto;cursor:crosshair;touch-action:none}
.stage.is-zoomed canvas{width:max(100%,var(--zoom-width));margin-inline:0}
@media(max-width:650px){button,select{min-height:44px}button.icon{min-width:44px}.stage{--stage-height:73dvh}output{margin-left:0}}
</style>
<main aria-label="ライフゲーム">
  <div class="board-frame">
    <div class="toolbar" role="group" aria-label="操作">
      <div class="tool-group" role="group" aria-label="再生操作">
        <button id="run" class="icon" type="button" aria-label="再生" aria-keyshortcuts="Space" title="再生" aria-pressed="false"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5v15l12-7.5Z" fill="currentColor"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14m8-14v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
        <button id="step" class="icon" type="button" aria-label="1世代進める" aria-keyshortcuts="ArrowRight" title="1世代進める"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l11-7ZM19 5v14" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="clear" class="icon" type="button" aria-label="盤面を消去" title="盤面を消去"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9 7V4h6v3m-8 0 1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="tool-group" role="group" aria-label="盤面設定">
        <select id="board-size" aria-label="盤面サイズ"><option value="64x40">64 × 40</option><option value="96x56" selected>96 × 56</option><option value="128x72">128 × 72</option></select>
        <select id="pattern" aria-label="初期パターン"><option value="glider">グライダー</option><option value="blinker">ブリンカー</option><option value="block">ブロック</option><option value="random">ランダム</option></select>
        <button id="preset" type="button">配置</button>
      </div>
      <div class="tool-group" role="group" aria-label="盤面表示">
        <button id="zoom" type="button" aria-pressed="false">拡大</button>
        <button id="pan" type="button" aria-pressed="false" disabled>移動</button>
      </div>
      <output id="status" aria-live="off"></output>
    </div>
    <div id="stage" class="stage"><canvas id="board" tabindex="0" aria-label="ライフゲームの盤面"></canvas></div>
  </div>
</main>
<script type="module">
const Life = (() => {
// BEND_COMPILED_MODULE
})();
// BOARD_MODULE
const el=(id)=>document.getElementById(id);
const cv=el('board'), ctx=cv.getContext('2d'), stage=el('stage'), run=el('run'), px=12;
let board=makeBoard(96,56), generation=0, timer=null, paint=null, drag=null;
let zoomed=false, panning=false;
const patterns={glider:[[1,0],[2,1],[0,2],[1,2],[2,2]],blinker:[[0,1],[1,1],[2,1]],block:[[0,0],[1,0],[0,1],[1,1]]};
function setGeometry(){
  cv.width=board.width*px;cv.height=board.height*px;
  stage.style.setProperty('--zoom-width',board.width*18+'px');
  stage.style.setProperty('--ratio',String(board.width/board.height));
  cv.setAttribute('aria-label',`${board.width} × ${board.height} の盤面`);
}
function render(){
  ctx.fillStyle='#171d38';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#293252';
  for(let x=1;x<board.width;x++)ctx.fillRect(x*px,0,1,cv.height);
  for(let y=1;y<board.height;y++)ctx.fillRect(0,y*px,cv.width,1);
  let alive=0;
  ctx.fillStyle='#ffba70';
  for(let y=0;y<board.height;y++)for(let w=0;w<board.stride;w++){
    let v=board.words[y*board.stride+w];
    while(v){
      const x=w*32+31-Math.clz32(v&-v);
      ctx.fillRect(x*px+1,y*px+1,px-1,px-1);alive++;
      v&=v-1;
    }
  }
  el('status').value=`${board.width} × ${board.height} ｜ 世代 ${generation} / 生存 ${alive}`;
}
function next(){board=advance(Life,board);generation++;render();}
function stop(){if(timer!==null){clearInterval(timer);timer=null;}run.title='再生';run.setAttribute('aria-label','再生');run.setAttribute('aria-pressed','false');}
function reset(){stop();board=makeBoard(board.width,board.height);generation=0;}
function place(name){
  reset();
  if(name==='random'){
    for(let y=0;y<board.height;y++)for(let x=0;x<board.width;x++)if(Math.random()<.24)putCell(board,x,y,1);
  }else{
    const ax=(board.width>>>1)-1,ay=(board.height>>>1)-1;
    for(const [x,y] of patterns[name])putCell(board,ax+x,ay+y,1);
  }
  render();
}
function setMode(on){
  panning=on;
  el('pan').textContent=on?'配置に戻る':'移動';
  el('pan').setAttribute('aria-pressed',String(on));
  cv.style.cursor=on?'grab':'crosshair';
}
el('zoom').addEventListener('click',()=>{
  zoomed=!zoomed;
  stage.classList.toggle('is-zoomed',zoomed);
  el('zoom').textContent=zoomed?'全体表示':'拡大';
  el('zoom').setAttribute('aria-pressed',String(zoomed));
  el('pan').disabled=!zoomed;
  setMode(false);
  stage.scrollLeft=zoomed?(stage.scrollWidth-stage.clientWidth)/2:0;
  stage.scrollTop=zoomed?(stage.scrollHeight-stage.clientHeight)/2:0;
});
el('pan').addEventListener('click',()=>setMode(!panning));
el('board-size').addEventListener('change',()=>{
  stop();const [w,h]=el('board-size').value.split('x').map(Number);
  board=resizeBoard(board,w,h);setGeometry();render();
});
function locate(e){
  const rect=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)*board.width/rect.width),y=Math.floor((e.clientY-rect.top)*board.height/rect.height);
  return x>=0&&x<board.width&&y>=0&&y<board.height?[x,y]:null;
}
function applyStroke(p){
  if(!p||!paint||p[0]===paint.x&&p[1]===paint.y)return;
  const [tx,ty]=p;let {x,y}=paint;
  const dx=Math.abs(tx-x),sx=x<tx?1:-1,dy=-Math.abs(ty-y),sy=y<ty?1:-1;let error=dx+dy;
  for(;;){
    putCell(board,x,y,paint.on);
    if(x===tx&&y===ty)break;
    const e2=2*error;if(e2>=dy){error+=dy;x+=sx;}if(e2<=dx){error+=dx;y+=sy;}
  }
  paint.x=tx;paint.y=ty;render();
}
cv.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button!==0)return;
  if(panning){
    drag={x:e.clientX,y:e.clientY,left:stage.scrollLeft,top:stage.scrollTop};
    cv.setPointerCapture(e.pointerId);return;
  }
  const p=locate(e);if(!p)return;stop();const [x,y]=p;
  paint={x,y,on:!getCell(board,x,y)};putCell(board,x,y,paint.on);cv.setPointerCapture(e.pointerId);render();
});
cv.addEventListener('pointermove',e=>{
  if(!e.isPrimary)return;
  if(drag){stage.scrollLeft=drag.left+drag.x-e.clientX;stage.scrollTop=drag.top+drag.y-e.clientY;}
  else applyStroke(locate(e));
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(event,e=>{if(e.isPrimary){paint=null;drag=null;}});
function toggleRun(){
  if(timer!==null){stop();return;}
  timer=setInterval(next,135);run.title='停止';run.setAttribute('aria-label','停止');run.setAttribute('aria-pressed','true');
}
function stepOnce(){stop();next();}
run.addEventListener('click',toggleRun);
el('step').addEventListener('click',stepOnce);
document.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.isComposing||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  const target=e.target;
  if(target.isContentEditable||target.closest?.('input,select,textarea'))return;
  if(e.key===' '&&target.closest?.('button,a[href]'))return; // Preserve native activation.
  if(e.key!==' '&&e.key!=='ArrowRight')return;
  e.preventDefault();
  if(e.repeat)return;
  if(e.key===' ')toggleRun();else stepOnce();
});
el('clear').addEventListener('click',()=>{reset();render();});
el('preset').addEventListener('click',()=>place(el('pattern').value));
setGeometry();place('glider');
</script>
</html>
